<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VR Office Builder V4</title><style>
:root{--bg:#0b1118;--panel:#121a24;--line:#2a394a;--text:#f6f8fb;--muted:#9aabbc;--accent:#ff7a1a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;overflow:hidden}.app{height:100vh;display:grid;grid-template-rows:62px 1fr}.top{display:flex;align-items:center;gap:10px;padding:0 14px;background:#0f1720;border-bottom:1px solid var(--line)}.brand{font-weight:900;margin-right:auto}.brand span{color:var(--accent)}.btn,input{font:inherit}.btn{background:#1a2633;border:1px solid var(--line);color:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);font-weight:800}.top input{width:250px;background:#1a2633;border:1px solid var(--line);color:#fff;border-radius:9px;padding:9px 10px}.workspace{display:grid;grid-template-columns:220px 1fr 250px;min-height:0}.side{background:var(--panel);padding:14px;overflow:auto}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}h3{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:14px 0 8px}.asset-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.asset{background:#192532;border:1px solid var(--line);color:#fff;border-radius:10px;padding:10px 6px;cursor:pointer}.asset small{display:block;color:var(--muted);margin-top:3px}.stage-wrap{overflow:auto;background:#070b10;padding:16px}.stage,.test-stage{position:relative;width:1440px;height:1056px;background:#d7d1c6;box-shadow:0 0 0 1px #747474;overflow:hidden}.grid{position:absolute;inset:0;background-image:linear-gradient(#00000010 1px,transparent 1px),linear-gradient(90deg,#00000010 1px,transparent 1px);background-size:32px 32px;pointer-events:none;z-index:1}.zone{position:absolute;z-index:2;overflow:hidden;border:14px solid #202831;box-shadow:inset 0 0 0 4px #c8b99c}.zone::after{content:attr(data-label);position:absolute;left:12px;top:10px;background:#101720d9;color:#fff;font-size:10px;font-weight:900;padding:5px 8px;border-radius:6px;z-index:4}.zone.ceo,.zone.priv{background:repeating-linear-gradient(0deg,#704b34 0 14px,#785139 14px 28px)}.zone.prod{background:repeating-linear-gradient(0deg,#5e574e 0 14px,#676057 14px 28px)}.zone.recep{background:repeating-linear-gradient(90deg,#8e806f 0 18px,#968776 18px 36px)}.zone.conv{background:repeating-linear-gradient(90deg,#31533f 0 16px,#375c45 16px 32px)}.zone.aud{background:repeating-linear-gradient(90deg,#382a31 0 16px,#432f38 16px 32px)}.zone.corr{background:repeating-linear-gradient(0deg,#c9c3b8 0 16px,#d0cabf 16px 32px);border:0;box-shadow:none}.zone.corr::after{left:50%;transform:translateX(-50%)}.door-slot{position:absolute;background:#a06a3f;border:4px solid #4d2f1f;z-index:7;box-shadow:inset 0 0 0 2px #c58b58}.obj,.test-object{position:absolute;z-index:6;display:flex;align-items:center;justify-content:center;transform-origin:center;user-select:none}.obj{cursor:grab;border:2px solid transparent}.obj.selected{outline:2px solid #2f80ed;outline-offset:2px}.sprite{position:relative;width:100%;height:100%;image-rendering:pixelated}.wall{background:linear-gradient(#c8b797 0 12%,#2a3038 12% 68%,#111820 68%)}.door{background:linear-gradient(90deg,#5b3824 0 8%,#9b673c 8% 88%,#4b2d1e 88%);box-shadow:inset 0 0 0 4px #3c2418}.door::after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:#e3bd73;right:9px;top:50%}.desk{background:#8a5737;box-shadow:inset 0 0 0 4px #5d3824,inset 0 -11px #70442b}.desk::before{content:"";position:absolute;width:28%;height:26%;top:10%;right:12%;background:#1b2630;border:4px solid #111820}.chair{background:linear-gradient(#1c252d 0 48%,#354653 48%);border-radius:7px;box-shadow:0 4px #111820}.sofa{background:#536f7e;border:5px solid #324b59;border-radius:8px;box-shadow:inset 0 7px #6e8995}.counter{background:#5a4535;border:5px solid #3f3025;box-shadow:inset 0 -10px #443327}.workstation{background:#74472d;border:4px solid #4d2e1d}.workstation::before,.workstation::after{content:"";position:absolute;width:28%;height:30%;top:-12%;background:#24323d;border:3px solid #101820}.workstation::before{left:12%}.workstation::after{right:12%}.auditorium-chair{background:#713b43;border:4px solid #4f252c;border-radius:5px;box-shadow:0 4px #28161a}.plant{background:#8b5b34;border-radius:0 0 5px 5px}.plant::before{content:"";position:absolute;width:70%;height:80%;left:15%;top:-55%;background:radial-gradient(circle at 25% 60%,#497b49 0 22%,transparent 23%),radial-gradient(circle at 70% 35%,#5b8e54 0 23%,transparent 24%),radial-gradient(circle at 60% 80%,#356b3c 0 24%,transparent 25%)}.tv{background:#13212a;border:6px solid #252d34;box-shadow:inset 0 0 0 4px #678392}.rug{background:repeating-linear-gradient(90deg,#9a7248 0 14px,#b78a59 14px 28px);border:5px solid #6d4d33}.field{margin-bottom:10px}.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.field input{width:100%;background:#1a2633;border:1px solid var(--line);color:#fff;border-radius:8px;padding:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hint{font-size:12px;line-height:1.5;color:var(--muted)}.test-overlay{position:fixed;inset:0;background:#070b10;z-index:1000;display:none;flex-direction:column}.test-overlay.active{display:flex}.testbar{height:58px;background:#0f1720;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:12px}.testbar strong{margin-right:auto}.test-wrap{flex:1;overflow:auto;padding:16px;display:flex;justify-content:center}.avatar{position:absolute;width:22px;height:28px;background:linear-gradient(#d49a6a 0 30%,#1c2631 30% 65%,#273d54 65%);border:2px solid #fff;z-index:99;box-shadow:0 3px 8px #0008}
</style></head><body>
<div class="app"><header class="top"><div class="brand">VR <span>OFFICE</span> BUILDER V4</div><input id="officeName" value="Meu Escritório"><button class="btn" id="importBtn">Importar JSON</button><input id="importFile" type="file" accept=".json,application/json" hidden><button class="btn" id="saveBtn">Salvar</button><button class="btn" id="exportBtn">Exportar JSON</button><button class="btn primary" id="testBtn">▶ Testar escritório</button></header><main class="workspace"><aside class="side left"><h3>Construção</h3><div id="construction" class="asset-grid"></div><h3>Mobiliário</h3><div id="furniture" class="asset-grid"></div><h3>Decoração</h3><div id="decor" class="asset-grid"></div></aside><section class="stage-wrap"><div id="stage" class="stage"><div class="grid"></div></div></section><aside class="side right"><h3>V4 Arquitetura</h3><p class="hint">Planta refinada: corredores consistentes, privativas padronizadas, auditório completo e portas encaixadas nas paredes.</p><h3>Propriedades</h3><div id="empty" class="hint">Selecione um objeto.</div><div id="inspector" hidden><div class="field"><label>Nome</label><input id="pLabel"></div><div class="row"><div class="field"><label>X</label><input id="pX" type="number"></div><div class="field"><label>Y</label><input id="pY" type="number"></div></div><button class="btn" id="rotateBtn">↻ Girar</button> <button class="btn" id="dupBtn">Duplicar</button> <button class="btn" id="delBtn">Excluir</button></div></aside></main></div>
<div id="testOverlay" class="test-overlay"><div class="testbar"><strong id="testTitle">Modo Teste V4</strong><span class="hint">Mover: WASD ou setas • etiquetas ocultas no teste</span><button id="backBtn" class="btn">← Voltar ao editor</button></div><div class="test-wrap"><div id="testStage" class="test-stage"><div class="grid"></div><div id="avatar" class="avatar"></div></div></div></div>
<script>
const GRID=32,STORAGE='vr-office-builder-v4',$=id=>document.getElementById(id);const ASSETS=[['wall','Parede','construction',128,32,true],['door','Porta','construction',64,32,false],['desk','Mesa Executiva','furniture',96,64,true],['chair','Cadeira','furniture',32,32,true],['sofa','Sofá','furniture',96,48,true],['counter','Balcão','furniture',128,48,true],['workstation','Estação AV','furniture',96,64,true],['auditorium-chair','Poltrona Auditório','furniture',32,32,true],['plant','Planta','decor',32,32,true],['tv','TV','decor',96,48,true],['rug','Tapete','decor',128,96,false]].map(a=>({id:a[0],label:a[1],cat:a[2],w:a[3],h:a[4],collision:a[5]}));let project={version:1,name:'Meu Escritório',objects:[],zones:[],spawn:{x:2,y:2}},selected=null,drag=null,testing=false,avatar={x:112,y:832,w:22,h:28};
const LAYOUT={ceo:{x:64,y:64,w:320,h:256},producao:{x:416,y:64,w:352,h:256},privativa01:{x:800,y:64,w:256,h:256},privativa02:{x:1088,y:64,w:256,h:256},recepcao:{x:64,y:352,w:288,h:352},corredor:{x:384,y:320,w:736,h:352},convivencia:{x:416,y:384,w:576,h:224},privativa03:{x:1088,y:384,w:256,h:224},privativa04:{x:1088,y:640,w:256,h:224},auditorio:{x:384,y:704,w:672,h:288}};
const GROUPS={ceo:/^ceo_|door_ceo/,producao:/^prod_|door_prod/,privativa01:/^p1_|door_p1/,privativa02:/^p2_|door_p2/,recepcao:/^rec_/,convivencia:/^conv_|door_conv/,privativa03:/^p3_|door_p3/,privativa04:/^p4_|door_p4/,auditorio:/^aud_|door_aud/};
const OLD={ceo:{x:192,y:32,w:288,h:288},producao:{x:512,y:32,w:320,h:256},privativa01:{x:864,y:32,w:192,h:256},privativa02:{x:1056,y:32,w:192,h:256},recepcao:{x:160,y:320,w:288,h:352},convivencia:{x:480,y:384,w:416,h:192},privativa03:{x:1056,y:352,w:192,h:160},privativa04:{x:1056,y:544,w:192,h:160},auditorio:{x:416,y:640,w:544,h:224}};
function uid(){return'o_'+Math.random().toString(36).slice(2,8)+Date.now().toString(36)}function norm(d){if(!d||!Array.isArray(d.objects))throw Error('JSON inválido');return{version:d.version||1,name:d.name||'Escritório',objects:d.objects.map((o,i)=>({...o,id:o.id||uid(),x:+o.x||0,y:+o.y||0,width:+o.width||32,height:+o.height||32,rotation:+o.rotation||0,collision:!!o.collision,zIndex:+o.zIndex||i+1})),zones:Array.isArray(d.zones)?d.zones:[],spawn:d.spawn||{x:2,y:2}}}
function refine(){project.zones=Object.entries(LAYOUT).map(([id,r])=>({id,label:id==='ceo'?'Sala CEO - Victor Romero':id==='producao'?'Produção Audiovisual - 3 estações':id.startsWith('privativa')?'Sala '+id.replace('privativa','Privativa '):id==='recepcao'?'Recepção':id==='convivencia'?'Área de Convivência':id==='auditorio'?'Auditório':'Corredor Central',x:r.x,y:r.y,width:r.w,height:r.h}));for(const [g,re] of Object.entries(GROUPS)){const from=OLD[g],to=LAYOUT[g];if(!from||!to)continue;for(const o of project.objects){if(!re.test(o.id||''))continue;const rx=(o.x-from.x)/from.w,ry=(o.y-from.y)/from.h;o.x=Math.round((to.x+rx*to.w)/GRID)*GRID;o.y=Math.round((to.y+ry*to.h)/GRID)*GRID}}
const fixed={door_ceo:[320,288],door_prod:[576,288],door_p1:[896,288],door_p2:[1184,288],door_p3:[1056,448],door_p4:[1056,704],door_conv:[704,576],door_aud:[704,672]};for(const o of project.objects){if(fixed[o.id]){o.x=fixed[o.id][0];o.y=fixed[o.id][1]}}
project.spawn={x:4,y:26};$('officeName').value=project.name;save()}
function zoneClass(id){if(id==='ceo')return'ceo';if(id.startsWith('privativa'))return'priv';if(id==='producao')return'prod';if(id==='recepcao')return'recep';if(id==='convivencia')return'conv';if(id==='auditorio')return'aud';return'corr'}function sprite(o){let s=document.createElement('div');s.className='sprite '+o.assetId;return s}function renderZones(root){root.querySelectorAll('.zone').forEach(e=>e.remove());for(const z of project.zones){let e=document.createElement('div');e.className='zone '+zoneClass(z.id);e.dataset.label=z.label||z.id;Object.assign(e.style,{left:z.x+'px',top:z.y+'px',width:z.width+'px',height:z.height+'px'});root.appendChild(e)}let g=root.querySelector('.grid');if(g)root.appendChild(g)}function render(){let st=$('stage');st.querySelectorAll('.obj,.zone').forEach(e=>e.remove());renderZones(st);for(const o of project.objects){let e=document.createElement('div');e.className='obj'+(selected===o.id?' selected':'');Object.assign(e.style,{left:o.x+'px',top:o.y+'px',width:o.width+'px',height:o.height+'px',transform:`rotate(${o.rotation||0}deg)`,zIndex:o.zIndex||6});e.title=o.label||o.assetId;e.appendChild(sprite(o));e.onpointerdown=ev=>startDrag(ev,o);e.onclick=ev=>{ev.stopPropagation();selected=o.id;render()};st.appendChild(e)}updateInspector()}
function renderLib(){for(const a of ASSETS){let b=document.createElement('button');b.className='asset';b.innerHTML=`${a.label}<small>${a.w}×${a.h}</small>`;b.onclick=()=>{let o={id:uid(),assetId:a.id,label:a.label,category:a.cat,x:160,y:128,width:a.w,height:a.h,rotation:0,collision:a.collision,zIndex:project.objects.length+6};project.objects.push(o);selected=o.id;render();save()};$(a.cat).appendChild(b)}}function startDrag(e,o){e.stopPropagation();selected=o.id;drag={id:o.id,sx:e.clientX,sy:e.clientY,ox:o.x,oy:o.y};e.currentTarget.setPointerCapture(e.pointerId);e.currentTarget.onpointermove=ev=>{let q=project.objects.find(x=>x.id===drag.id);q.x=Math.round((drag.ox+ev.clientX-drag.sx)/32)*32;q.y=Math.round((drag.oy+ev.clientY-drag.sy)/32)*32;render()};e.currentTarget.onpointerup=()=>{drag=null;save()}}function updateInspector(){let o=project.objects.find(x=>x.id===selected);$('empty').hidden=!!o;$('inspector').hidden=!o;if(!o)return;$('pLabel').value=o.label;$('pX').value=o.x;$('pY').value=o.y}function bind(id,key){$(id).onchange=e=>{let o=project.objects.find(x=>x.id===selected);if(!o)return;o[key]=key==='label'?e.target.value:+e.target.value;render();save()}}bind('pLabel','label');bind('pX','x');bind('pY','y');function save(){project.name=$('officeName').value||'Meu Escritório';localStorage.setItem(STORAGE,JSON.stringify(project))}function load(){try{let r=localStorage.getItem(STORAGE);if(r)project=norm(JSON.parse(r))}catch(e){}$('officeName').value=project.name}
$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;project=norm(JSON.parse(await f.text()));refine();render();alert('V4 aplicada: layout refinado com sucesso.')};$('saveBtn').onclick=save;$('exportBtn').onclick=()=>{save();let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(project,null,2)],{type:'application/json'}));a.download='vr-office-v4.json';a.click()};$('rotateBtn').onclick=()=>{let o=project.objects.find(x=>x.id===selected);if(o){o.rotation=((o.rotation||0)+90)%360;render();save()}};$('dupBtn').onclick=()=>{let o=project.objects.find(x=>x.id===selected);if(o){let n={...o,id:uid(),x:o.x+32,y:o.y+32};project.objects.push(n);selected=n.id;render();save()}};$('delBtn').onclick=()=>{project.objects=project.objects.filter(x=>x.id!==selected);selected=null;render();save()};
function renderTest(){let st=$('testStage');st.querySelectorAll('.zone,.test-object').forEach(e=>e.remove());renderZones(st);for(const o of project.objects){let e=document.createElement('div');e.className='test-object';Object.assign(e.style,{left:o.x+'px',top:o.y+'px',width:o.width+'px',height:o.height+'px',transform:`rotate(${o.rotation||0}deg)`,zIndex:o.zIndex||6});e.appendChild(sprite(o));st.appendChild(e)}avatar.x=(project.spawn?.x||4)*32;avatar.y=(project.spawn?.y||26)*32;$('avatar').style.left=avatar.x+'px';$('avatar').style.top=avatar.y+'px';$('testTitle').textContent='▶ '+project.name+' — V4'}function hit(x,y){return project.objects.some(o=>o.collision&&x<o.x+o.width&&x+avatar.w>o.x&&y<o.y+o.height&&y+avatar.h>o.y)}function move(dx,dy){let nx=Math.max(0,Math.min(1440-avatar.w,avatar.x+dx)),ny=Math.max(0,Math.min(1056-avatar.h,avatar.y+dy));if(!hit(nx,avatar.y))avatar.x=nx;if(!hit(avatar.x,ny))avatar.y=ny;$('avatar').style.left=avatar.x+'px';$('avatar').style.top=avatar.y+'px'}$('testBtn').onclick=()=>{save();testing=true;renderTest();$('testOverlay').classList.add('active')};$('backBtn').onclick=()=>{testing=false;$('testOverlay').classList.remove('active')};document.addEventListener('keydown',e=>{if(testing){if(['ArrowUp','w','W'].includes(e.key))move(0,-8);if(['ArrowDown','s','S'].includes(e.key))move(0,8);if(['ArrowLeft','a','A'].includes(e.key))move(-8,0);if(['ArrowRight','d','D'].includes(e.key))move(8,0)}});load();renderLib();render();
</script></body></html>
